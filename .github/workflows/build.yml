name: Build (development)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: xcodebuild -version
      - name: Build Apple Silicon app
        env:
          MACPANEL_ARCH: arm64
        run: ./build.sh
      - name: Check bundle and signature
        run: |
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dist/MacPanel.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 dist/MacPanel.app
          file dist/MacPanel.app/Contents/MacOS/MacPanel
      - name: Create development DMG
        run: ./scripts/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MacPanel-arm64-adhoc-preview
          path: dist/MacPanel.dmg
          if-no-files-found: error
